[project]
name = "crm-fastapi-light"
version = "0.1.0"
description = "simple fastapi crm"
authors = [
    {name = "ruby-fedora",email = "ruby-fedora@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "pydantic[email] (>=2.11.4,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "fastapi-users[sqlalchemy] (>=14.0.1,<15.0.0)",
    "watchfiles (>=1.0.5,<2.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "sqladmin[full] (>=0.20.1,<0.21.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=0.26.0,<0.27.0)",
    "trio (>=0.30.0,<0.31.0)",
    "fastapi-csrf-protect (>=1.0.3,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.9"
aiosqlite = "^0.21.0"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

[tool.pytest.ini_options]
pythonpath = [
  "./src"
]
asyncio_default_fixture_loop_scope="session"